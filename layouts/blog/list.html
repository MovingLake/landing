{{ define "main" }}
<section class="hero hero-industry">
  <div class="container">
    <h1>{{ .Title }}</h1>
    <p class="lead">News, guides and announcements from the MovingLake team.</p>
  </div>
</section>
<section class="section">
  <div class="container">
    <div class="post-grid">
      {{ range .Pages.ByDate.Reverse }}
      <a class="post-card" href="{{ .RelPermalink }}">
        {{ with .Params.image }}<img src="{{ . }}" alt="" loading="lazy">{{ end }}
        <div class="post-card-body">
          <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
          <h2>{{ .Title }}</h2>
          <p>{{ .Params.summary }}</p>
        </div>
      </a>
      {{ end }}
    </div>
  </div>
</section>
{{ end }}
