<header class="site-header">
  <div class="container nav-wrap">
    <a href="{{ "/" | relURL }}" class="brand" aria-label="MovingLake home">
      <img src="{{ .Site.Params.logo | relURL }}" alt="MovingLake" width="190" height="60">
    </a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-hidden="true">
    <label for="nav-toggle" class="nav-burger" aria-label="Toggle navigation"><span></span><span></span><span></span></label>
    <nav class="site-nav">
      <ul>
        {{ range .Site.Menus.main }}
          {{ if .HasChildren }}
          <li class="has-children">
            <span class="nav-link">{{ .Name }} <svg width="10" height="6" viewBox="0 0 10 6"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></span>
            <ul class="dropdown">
              {{ range .Children }}<li><a href="{{ .URL }}">{{ .Name }}</a></li>{{ end }}
            </ul>
          </li>
          {{ else }}
          <li><a class="nav-link{{ if $.IsMenuCurrent "main" . }} active{{ end }}" href="{{ .URL }}">{{ .Name }}</a></li>
          {{ end }}
        {{ end }}
        <li class="nav-cta"><a class="btn btn-primary" href="{{ "/contact-us/" | relURL }}">Get Started</a></li>
      </ul>
    </nav>
  </div>
</header>
